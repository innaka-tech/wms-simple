version: '3.8'

# WMS Simple Enterprise — Production (server innaka, /data/docker-data/wms-simple)
# PostgreSQL memakai global stack host (container global_postgres, exposed di host 5432).
# Kredensial via file .env sebelah file ini (JANGAN di-commit).

services:
  # Nginx Gateway Reverse Proxy — satu-satunya port yang expose ke internet
  nginx:
    image: nginx:1.25-alpine
    container_name: wms-simple-gateway
    restart: always
    ports:
      - "${WMS_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wms_network

  # Hono Backend Application (Node.js/TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-simple-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nuxt 3 Frontend (SSR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms-simple-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  wms_network:
    driver: bridge
