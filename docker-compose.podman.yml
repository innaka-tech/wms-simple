version: '3.8'

# WMS Simple Enterprise — Podman Production Stack
# Container Runtime: Podman (rootless or rootful)
# Services: Hono Backend API + Nuxt 3 Frontend + Nginx Gateway
# Database: PostgreSQL 16 on Host OS (127.0.0.1 / host.containers.internal)

services:
  # Hono Backend Application (Node.js/TypeScript)
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/latiefdole/wms-simple-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-simple-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.containers.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-wms_app}
      DB_PASSWORD: ${DB_PASSWORD:-wms_secure_password_2026}
      DB_NAME: ${DB_NAME:-wms_simple_db}
      JWT_SECRET: ${JWT_SECRET:-wms_super_secret_jwt_key_staging_2026_change_in_prod}
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nuxt 3 Frontend (SSR)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/latiefdole/wms-simple-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms-simple-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: /api
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nginx Gateway Reverse Proxy
  nginx:
    image: docker.io/library/nginx:1.25-alpine
    container_name: wms-simple-gateway
    restart: always
    ports:
      - "${WMS_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - backend
      - frontend
    networks:
      - wms_network

networks:
  wms_network:
    driver: bridge

