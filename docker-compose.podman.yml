version: '3.8'

# WMS Simple Enterprise — Podman Production Stack
# Container Runtime: Podman (rootless or rootful)
# Services: PostgreSQL 16 + Hono Backend API + Nuxt 3 Frontend + Nginx Gateway

services:
  # Database PostgreSQL 16
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: wms-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-wms_simple_db}
      POSTGRES_USER: ${DB_USER:-wms_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wms_secure_password_2026}
    volumes:
      - wms_pg_data:/var/lib/postgresql/data:Z
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wms_app} -d ${DB_NAME:-wms_simple_db} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Hono Backend Application (Node.js/TypeScript)
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/latiefdole/wms-simple-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-simple-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-wms_app}
      DB_PASSWORD: ${DB_PASSWORD:-wms_secure_password_2026}
      DB_NAME: ${DB_NAME:-wms_simple_db}
      JWT_SECRET: ${JWT_SECRET:-wms_super_secret_jwt_key_staging_2026_change_in_prod}
    depends_on:
      - postgres
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nuxt 3 Frontend (SSR)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/latiefdole/wms-simple-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms-simple-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: /api
    networks:
      - wms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nginx Gateway Reverse Proxy
  nginx:
    image: docker.io/library/nginx:1.25-alpine
    container_name: wms-simple-gateway
    restart: always
    ports:
      - "${WMS_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - backend
      - frontend
    networks:
      - wms_network

networks:
  wms_network:
    driver: bridge

volumes:
  wms_pg_data:
    driver: local
