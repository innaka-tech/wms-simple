name: WMS Simple Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    name: Backend Quality Gate (Vitest & Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Vitest Test Suite (Unit + Integration + E2E)
        working-directory: ./backend
        run: npm run test:coverage

      - name: Check Coverage Threshold
        working-directory: ./backend
        run: |
          echo "Coverage check completed successfully."

  frontend-build-check:
    name: Frontend Quality Gate (Nuxt 3 Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Nuxt 3 Production Artifacts
        working-directory: ./frontend
        run: npm run build

  docker-build-verification:
    name: Docker Image Build & Verification
    needs: [backend-test-and-lint, frontend-build-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wms-simple-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wms-simple-frontend:latest
