name: Build, Publish to GHCR & Deploy to Server (Podman)

on:
  push:
    branches:
      - main
      - ans
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.prep.outputs.backend_tag }}
      frontend_tag: ${{ steps.prep.outputs.frontend_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image tags
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_tag=ghcr.io/$OWNER_LC/wms-simple-backend:latest" >> "$GITHUB_OUTPUT"
          echo "backend_sha=ghcr.io/$OWNER_LC/wms-simple-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=ghcr.io/$OWNER_LC/wms-simple-frontend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=ghcr.io/$OWNER_LC/wms-simple-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.backend_tag }}
            ${{ steps.prep.outputs.backend_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.frontend_tag }}
            ${{ steps.prep.outputs.frontend_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy & Pull to Server via Podman
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.SERVER_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Prepare lowercase image tags
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_tag=ghcr.io/$OWNER_LC/wms-simple-backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=ghcr.io/$OWNER_LC/wms-simple-frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull Images & Restart Podman Stack on Server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          BACKEND_TAG: ${{ steps.prep.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.prep.outputs.frontend_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" << EOF
            set -e
            echo "==> Authenticating Podman to GHCR..."
            echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin

            echo "==> Pulling latest images from GHCR..."
            podman pull "$BACKEND_TAG"
            podman pull "$FRONTEND_TAG"

            echo "==> Updating repository files..."
            cd /data/wms-simple/repo
            git fetch origin
            git checkout ans || git checkout main
            git pull

            echo "==> Restarting services with updated images..."
            podman stop wms-simple-backend wms-simple-frontend || true
            podman rm wms-simple-backend wms-simple-frontend || true
            podman-compose -f docker-compose.podman.yml up -d

            echo "==> Verifying service health..."
            sleep 10
            podman ps
            curl -f -s http://127.0.0.1:8090/api/health || (echo "Healthcheck failed!" && exit 1)
            echo "==> Deployment successfully finished!"
          EOF
